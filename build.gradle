plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.+'
}

def minecraft_version = "26.2"
def loader_version = "0.20.1"
def fabric_api_version = "0.161.0+26.2"
def cloth_config_version = "26.2.155"

def mod_version = "1.5.7+26.x"
def mod_id = "itemcounter"

group = "me.giridharan"
version = mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    include "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    compileOnly files("C:/Users/Giridharan/.lunarclient/profiles/main/mods/modmenu-20.0.3.jar")
}

loom {
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

processResources {
    filesMatching('fabric.mod.json') {
        expand "mod_version": mod_version, "mod_id": mod_id, "loader_version": loader_version, "minecraft_version": minecraft_version
    }
}

jar {
    archiveBaseName.set("item-counter")
    archiveVersion.set(mod_version)
}

